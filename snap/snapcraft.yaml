name: quicksnipp
base: core24
version: "1.2.0"
summary: Fast snipping tool — capture, annotate, copy, record
description: |
  QuickSnipp captures a screen region, lets you annotate it, and copies
  it to the clipboard. Video mode records a selected rectangle to ~/Videos.

  This snap uses classic confinement so GNOME ScreenCast (still frames
  and region video) can talk to the session compositor. Strict sandbox
  snaps cannot use those APIs reliably.

  Source: https://github.com/marmarart/QuickSnipp
license: MIT
website: https://github.com/marmarart/QuickSnipp
issues: https://github.com/marmarart/QuickSnipp/issues
contact: https://github.com/marmarart/QuickSnipp/issues
source-code: https://github.com/marmarart/QuickSnipp
grade: devel
confinement: classic
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [arm64]
    build-for: [arm64]

apps:
  quicksnipp:
    command: bin/quicksnipp
    desktop: share/applications/quicksnipp.desktop
    environment:
      # Prefer the snap's Qt platform plugins; fall back to host Wayland/X11.
      QT_QPA_PLATFORM: wayland;xcb

parts:
  quicksnipp:
    plugin: nil
    source: .
    source-type: local
    override-build: |
      set -e
      mkdir -p "${CRAFT_PART_INSTALL}/lib/quicksnipp-src"
      cp -a quicksnipp "${CRAFT_PART_INSTALL}/lib/quicksnipp-src/"
      find "${CRAFT_PART_INSTALL}/lib/quicksnipp-src" -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
      install -Dm755 "${CRAFT_PROJECT_DIR}/snap/local/quicksnipp-launch" \
        "${CRAFT_PART_INSTALL}/bin/quicksnipp"
      install -Dm644 "${CRAFT_PROJECT_DIR}/snap/gui/quicksnipp.desktop" \
        "${CRAFT_PART_INSTALL}/share/applications/quicksnipp.desktop"
      install -Dm644 "${CRAFT_PROJECT_DIR}/snap/gui/icon.svg" \
        "${CRAFT_PART_INSTALL}/share/icons/hicolor/scalable/apps/io.github.marmarart.QuickSnipp.svg"
    stage-packages:
      - python3
      - python3-pyqt6
      - python3-pyqt6.qtsvg
      - qt6-wayland
      - libqt6gui6
      - libqt6widgets6
      - libqt6dbus6
      - libqt6waylandclient6
      - gstreamer1.0-tools
      - gstreamer1.0-plugins-base
      - gstreamer1.0-plugins-good
      - gstreamer1.0-plugins-ugly
      - gstreamer1.0-libav
      - gstreamer1.0-pipewire
      - libgstreamer1.0-0
      - ffmpeg
      - grim
      - libgl1
      - libegl1
      - libxkbcommon0
      - libxcb-cursor0
      - libxcb-icccm4
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-randr0
      - libxcb-render-util0
      - libxcb-shape0
      - libxcb-xinerama0
      - libxcb-xkb1
