[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quicksnipp"
version = "1.1.0"
description = "Fast snipping tool for Linux (Wayland and X11)"
readme = "README.md"
authors = [
    { name = "Vladimir" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.7",
]
keywords = ["screenshot", "snip", "snipping", "annotation", "wayland", "linux"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
]

[project.urls]
Homepage = "https://github.com/marmarart/QuickSnipp"
Issues = "https://github.com/marmarart/QuickSnipp/issues"

[project.scripts]
quicksnipp = "quicksnipp.main:main"

[tool.setuptools.packages.find]
include = ["quicksnipp*"]
